name: Validate and deploy Dining Split

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible install
        run: npm ci --ignore-scripts --no-fund
      - name: JavaScript and markup checks
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      # - name: Local security guardrails
      #   run: npm run security:check
      - name: Dependency advisory audit
        run: npm audit --omit=dev --audit-level=high

  # browser:
  #   runs-on: ubuntu-latest
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       browser: [chromium, firefox, webkit]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: '3.13'
  #     - name: Install browser test tooling
  #       run: |
  #         python -m pip install --disable-pip-version-check playwright==1.57.0
  #         python -m playwright install --with-deps ${{ matrix.browser }}
  #     - name: Exercise user workflows
  #       env:
  #         BROWSER_NAME: ${{ matrix.browser }}
  #       run: python -m unittest discover -s tests/browser -p 'test_*.py' -v

  static_analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialise JavaScript CodeQL analysis
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - name: Analyse JavaScript code
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: '/language:javascript-typescript'

  deploy:
    # OCR parses untrusted files: public deployment requires deliberate human dispatch.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [
      quality, 
      # browser, 
      static_analysis
      ]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: dining-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy exact validated source
        id: deployment
        uses: actions/deploy-pages@v4
